tagline: Monthly coaching for design leads navigating leadership growth.
description: Monthly 1:1 coaching for design leads who want to grow from senior individual contributor to a strategic design leader. We work on the skills that aren't taught in design school: hiring great designers, managing up, influencing roadmaps, building team culture, and handling the politics of product organisations.
features:
