tagline: Comprehensive audit of your design organisation with an action plan.
description: A 2-week deep-dive into your design organisation. I conduct stakeholder interviews, review processes and tooling, assess output quality across your product surface, and evaluate team structure and talent gaps. The engagement ends with an executive-ready audit report and a prioritised 90-day action plan presented to your leadership team.
features:
  - Stakeholder interviews
  - Process & tooling assessment
  - Portfolio and output quality review
  - Executive-ready audit report
  - 90-day action plan presentation
