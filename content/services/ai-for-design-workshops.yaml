name: AI for Design Workshops
price: 2499900
tagline: Hands-on workshop for design teams integrating AI into their workflow.
description: A structured full-day workshop (in-person or virtual) for design teams of up to 12 people. We cover AI-powered research analysis, image generation for ideation, AI-assisted prototyping, and building sustainable AI workflows. Every participant leaves with a personalised AI toolkit and a team adoption roadmap.
features:
  - Full-day in-person or virtual workshop
  - Custom toolkit for your workflow
  - Team assessment & recommendations
  - 90-day AI adoption roadmap
